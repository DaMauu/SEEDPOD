name: 功能建议（中文）
description: 想要新面板、新站点适配或新样式 · Chinese feature request
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - bluray（原盘转载面板）
        - PTScripts（站点小工具）
        - styles/r（主题样式）
        - pta（站点架构页）
        - 新模块
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 你现在怎么手动做这件事
      description: 说清现状和痛点，比直接说「加个按钮」有用得多
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的形态
      description: 面板入口放哪、触发方式、需要哪些字段

  - type: input
    id: sites
    attributes:
      label: 适用站点
      description: 站点类型与站点名，便于判断是否作为一个新适配器

  - type: textarea
    id: alternatives
    attributes:
      label: 已经试过的替代方案

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 这是单文件脚本能实现的（不需要后端或新依赖）
          required: true
        - label: 已搜索过现有 Issue，没有重复
          required: true
