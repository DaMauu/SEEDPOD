services:
  seedpod:
    build: .
    image: seedpod/panel:latest
    container_name: seedpod
    restart: unless-stopped
    ports:
      - "${PTA_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      PTA_PORT: 8080
      # 需要外部访问时再设，设了以后所有 /api 都要带 Authorization: Bearer <token>
      PTA_TOKEN: ""
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
