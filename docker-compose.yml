services:
  seedpod:
    build: .
    image: seedpod/panel:latest
    container_name: seedpod
    restart: unless-stopped
    ports:
      # 默认只开本机；要对外再设 PTA_BIND=0.0.0.0
      - "${PTA_BIND:-127.0.0.1}:${PTA_PORT:-8080}:8080"
    volumes:
      - ./data:/data
      # 可选：独立密钥，替代 /data/.secret
      # - ./secrets/seedpod.secret:/run/secrets/seedpod:ro
    environment:
      TZ: Asia/Shanghai
      PTA_PORT: 8080
      PTA_DATA: /data
      PTA_USER: "${PTA_USER:-}"
      PTA_PASS: "${PTA_PASS:-}"
      # Telegram 通知：留空则用面板里保存的加密配置
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_ALLOWED_USER_ID: "${TELEGRAM_ALLOWED_USER_ID:-}"
      # PTA_NOTIFY_WEBHOOK: "${PTA_NOTIFY_WEBHOOK:-}"
      # PTA_COOKIE_SECURE: "1"
      # PTA_SECRET_FILE: /run/secrets/seedpod
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
